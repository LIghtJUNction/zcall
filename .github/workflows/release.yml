name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment; choose none for first release or explicit version
        required: true
        type: choice
        default: patch
        options: [none, patch, minor, major]
      version:
        description: Optional stable MAJOR.MINOR.PATCH; requires bump=none
        required: false
        type: string
      publish:
        description: Publish the verified crate and record its release tag
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/release-request.json']
permissions:
  contents: read
concurrency:
  group: zcall-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'LIghtJUNction/zcall'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main for a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - name: Validate the explicit release request
        if: github.event_name == 'push'
        run: python3 scripts/release.py request
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolve the exact dependency from crates.io
        run: python3 scripts/release.py dependency
      - name: Prepare the version
        id: plan
        env:
          BUMP: ${{ inputs.bump || 'none' }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py prepare
      - run: rustup component add rustfmt clippy
      - run: cargo +1.99.1 test --all-targets --locked
      - run: cargo test --release --locked
      - run: cargo test --doc --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: python3 scripts/check_package.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo package --allow-dirty --locked
      - name: Check name ownership and unpublished version
        run: python3 scripts/release.py registry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            target/package/*.crate
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
  publish:
    needs: verify
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: python3 scripts/release.py dependency
      - name: Apply exactly the verified version
        env:
          BUMP: none
          VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: python3 scripts/release.py prepare
      - name: Check checkout, branch and tag
        run: python3 scripts/release.py git-preflight
      - name: Recheck registry immediately before publishing
        run: python3 scripts/release.py registry
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --allow-dirty
      - name: Record the published source
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          release_files=(Cargo.toml Cargo.lock)
          for path in comparison/Cargo.lock fuzz/Cargo.lock; do
            if [ -f "$path" ]; then
              release_files+=("$path")
            fi
          done
          if ! git diff --quiet HEAD -- "${release_files[@]}"; then
            git add -- "${release_files[@]}"
            git commit -m "chore: release $RELEASE_VERSION"
            git push origin HEAD:main
          fi
          if ! git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            git tag -a "v$RELEASE_VERSION" -m "zcall $RELEASE_VERSION"
            git push origin "refs/tags/v$RELEASE_VERSION"
          fi
          gh release create "v$RELEASE_VERSION" --verify-tag --title "zcall $RELEASE_VERSION" --generate-notes
